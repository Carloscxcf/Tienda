spring.application.name=training

#
# Context path
#
server.servlet.context-path=/training/v1

#
# Server port
#
server.port=9092

#
# flyway
#
#spring.flyway.enabled=true


#
# logging
#
logging.file.name=/restapi/log/training-restapi.log
logging.logback.rollingpolicy.file-name-pattern=/restapi/log/training-restapi-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=2GB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.clean-history-on-start=true
logging.level.com.yeisystems.training=DEBUG
logging.level.org.springframework.security=DEBUG

#
# security
#
oauth.clientDetails.logout.success.url=http://localhost:4200/on-logout
oauth.clientDetails.logout.cancel.url=http://localhost:4200

#
# Configuration properties files
#
spring.config.import=gateway-sqlserver.properties

documents.file.upload.base-dir=./documents
